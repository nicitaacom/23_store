worker_processes 1;
events { worker_connections 128; }
http {
  server {
    listen 8000;
    location /auth/v1/ {
      proxy_pass http://auth:9999/;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header apikey $http_apikey;
    }
    location /rest/v1/ {
      proxy_pass http://rest:3000/;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header apikey $http_apikey;
    }
  }
}
