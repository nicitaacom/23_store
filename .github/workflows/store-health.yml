name: Store health

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check production Supabase catalog
        env:
          STORE_URL: ${{ vars.NEXT_PUBLIC_PRODUCTION_URL || secrets.NEXT_PUBLIC_PRODUCTION_URL }}
          STORE_HEALTH_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          node --input-type=module <<'JS'
          const { STORE_URL, STORE_HEALTH_SECRET, GITHUB_STEP_SUMMARY } = process.env
          const { appendFile } = await import('node:fs/promises')
          let summary
          let healthy = false
          if (!STORE_URL || !STORE_HEALTH_SECRET) {
            summary = 'Configure the production URL and CRON_SECRET in GitHub Actions.'
          } else {
            try {
              const response = await fetch(new URL('/api/store-health', STORE_URL), {
                headers: { authorization: `Bearer ${STORE_HEALTH_SECRET}` },
                redirect: 'error',
                signal: AbortSignal.timeout(20000),
              })
              const health = await response.json().catch(() => null)
              healthy = response.ok && health?.ok === true
              const databaseStatus = Number.isInteger(health?.supabaseStatus) ? health.supabaseStatus : 'unknown'
              summary = `Health endpoint HTTP ${response.status}. Supabase status ${databaseStatus}.`
            } catch {
              summary = 'The production health endpoint was unreachable. Check the production URL and Cloudflare rules.'
            }
          }
          console.log(summary)
          await appendFile(GITHUB_STEP_SUMMARY, `${summary}\n`)
          if (!healthy) process.exitCode = 1
          JS
