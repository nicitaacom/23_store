name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate introduced commit names and pull request title
        env:
          COMMIT_NAMING_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          COMMIT_NAMING_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          COMMIT_NAMING_PR_TITLE: ${{ github.event.pull_request.title || '' }}
        run: node .github/scripts/validate-commit-naming.mjs

      - name: Test commit name validator
        run: pnpm test:commit-naming

      - name: Test custom ESLint rules
        run: pnpm test:eslint-rules

      - name: Test application storage and backup logic
        run: pnpm test:unit

      - name: Test streaming storage migration and rollback
        run: pnpm test:storage-cli

      - name: Lint tracked source
        run: pnpm lint

      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Type-check
        run: pnpm type-check

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: .cache/ms-playwright
          key: storybook-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook render, interaction, and accessibility tests
        run: pnpm test:storybook

      - name: Upload Storybook failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-failure-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            storybook-static
            test-results
            playwright-report

  required:
    name: CI required
    if: always()
    needs: [quality, storybook]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every CI job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          STORYBOOK_RESULT: ${{ needs.storybook.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$STORYBOOK_RESULT" = "success"
