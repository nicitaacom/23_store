name: Cypress monthly real-service checks

on:
  schedule:
    - cron: "23 3 1 * *"

permissions:
  contents: read
  deployments: read

concurrency:
  group: 23-store-monthly-real-service-tests
  cancel-in-progress: false

jobs:
  production-monthly:
    if: github.run_attempt == 1
    name: Production inventory, preflight, and browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      CYPRESS_INSTALL_BINARY: "0"
      NEXT_PUBLIC_PRODUCTION_URL: ${{ vars.NEXT_PUBLIC_PRODUCTION_URL || secrets.NEXT_PUBLIC_PRODUCTION_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_STRIPE_SECRET_KEY: ${{ secrets.NEXT_STRIPE_SECRET_KEY }}
      NEXT_RESEND_SECRET: ${{ secrets.NEXT_RESEND_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      NEXT_PUBLIC_AWS_REGION: ${{ vars.NEXT_PUBLIC_AWS_REGION || secrets.NEXT_PUBLIC_AWS_REGION }}
      PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
      NEXT_PUBLIC_PUSHER_APP_KEY: ${{ vars.NEXT_PUBLIC_PUSHER_APP_KEY || secrets.NEXT_PUBLIC_PUSHER_APP_KEY }}
      PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX: ${{ vars.PINECONE_INDEX || secrets.PINECONE_INDEX }}
      PINECONE_ENVIRONMENT: ${{ vars.PINECONE_ENVIRONMENT || secrets.PINECONE_ENVIRONMENT }}
      TINIFY_API_KEY_ARR: ${{ secrets.TINIFY_API_KEY_ARR }}
      DEVICE_ID_ENCRYPTION_KEY: ${{ secrets.DEVICE_ID_ENCRYPTION_KEY }}
      STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'r2' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || '23-store-public' }}
      NEXT_PUBLIC_R2_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_R2_PUBLIC_URL }}
      NEXT_PUBLIC_PAYPAL_CLIENT_ID_TEST: ${{ vars.NEXT_PUBLIC_PAYPAL_CLIENT_ID_TEST || secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID_TEST }}
      PAYPAL_CLIENT_SECRET_TEST: ${{ secrets.PAYPAL_CLIENT_SECRET_TEST }}
      PAYPAL_WEBHOOK_ID_TEST: ${{ secrets.PAYPAL_WEBHOOK_ID_TEST }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NEXT_COINMARKETCAP_SECRET: ${{ secrets.NEXT_COINMARKETCAP_SECRET }}
      NEXT_PUBLIC_METAMASK_ADRESS_ETH: ${{ vars.NEXT_PUBLIC_METAMASK_ADRESS_ETH }}
      NEXT_PUBLIC_METAMASK_ADRESS_BNB: ${{ vars.NEXT_PUBLIC_METAMASK_ADRESS_BNB }}
      NEXT_PUBLIC_METAMASK_ADRESS_MATIC: ${{ vars.NEXT_PUBLIC_METAMASK_ADRESS_MATIC }}
      NEXT_PUBLIC_SOLANA_ADDRESS: ${{ vars.NEXT_PUBLIC_SOLANA_ADDRESS }}
      NEXT_PUBLIC_SOLANA_CLUSTER: ${{ vars.NEXT_PUBLIC_SOLANA_CLUSTER || 'devnet' }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      PRICE_WEBHOOK_SECRET: ${{ secrets.PRICE_WEBHOOK_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      E2E_TEST_EMAIL_DOMAIN: ${{ vars.E2E_TEST_EMAIL_DOMAIN }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_MAX_PROVIDER_COST_USD: ${{ vars.E2E_MAX_PROVIDER_COST_USD }}
      E2E_MAX_PAID_OPERATIONS: ${{ vars.E2E_MAX_PAID_OPERATIONS }}
      E2E_OPERATION_COST_ESTIMATES_JSON: ${{ vars.E2E_OPERATION_COST_ESTIMATES_JSON }}
      E2E_IMAGE_COMPRESSION_MAX_PROVIDER_CALLS: ${{ vars.E2E_IMAGE_COMPRESSION_MAX_PROVIDER_CALLS }}
      E2E_CATEGORY_SUGGESTION_MAX_PROVIDER_CALLS: ${{ vars.E2E_CATEGORY_SUGGESTION_MAX_PROVIDER_CALLS }}
      E2E_TRANSLATION_MAX_PROVIDER_CALLS: ${{ vars.E2E_TRANSLATION_MAX_PROVIDER_CALLS }}
      E2E_TRANSLATE_FIELD_MAX_PROVIDER_CALLS: ${{ vars.E2E_TRANSLATE_FIELD_MAX_PROVIDER_CALLS }}
      E2E_AI_PRICING_MAX_PROVIDER_CALLS: ${{ vars.E2E_AI_PRICING_MAX_PROVIDER_CALLS }}
      E2E_AI_IMAGE_MAX_PROVIDER_CALLS: ${{ vars.E2E_AI_IMAGE_MAX_PROVIDER_CALLS }}
      E2E_PRINT_AREA_MAX_PROVIDER_CALLS: ${{ vars.E2E_PRINT_AREA_MAX_PROVIDER_CALLS }}
      E2E_SALES_CHAT_MAX_PROVIDER_CALLS: ${{ vars.E2E_SALES_CHAT_MAX_PROVIDER_CALLS }}
      E2E_MEMORY_MAX_PROVIDER_CALLS: ${{ vars.E2E_MEMORY_MAX_PROVIDER_CALLS }}
      E2E_PRICE_RESEARCH_MAX_PROVIDER_CALLS: ${{ vars.E2E_PRICE_RESEARCH_MAX_PROVIDER_CALLS }}
      E2E_COINMARKETCAP_MAX_PROVIDER_CALLS: ${{ vars.E2E_COINMARKETCAP_MAX_PROVIDER_CALLS }}
      E2E_RUN_ID: gha-${{ github.run_id }}
      E2E_SEND_REPORT: "true"
      E2E_REPORT_FROM: e2e-test-23-store@nicitaa.com
      E2E_REPORT_TO: support@nicitaa.com
      E2E_REPORT_DELIVERY_TIMEOUT_SECONDS: "30"
      E2E_ARTIFACT_DIR: artifacts/e2e

    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Cypress browser binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inventory, preflight, and run the monthly production suite
        id: monthly
        continue-on-error: true
        run: pnpm e2e:monthly

      - name: Upload monthly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-monthly-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/e2e
            cypress/screenshots
            cypress/videos
            cypress/results

      - name: Fail the job when checks or reporting failed
        if: always() && steps.monthly.outcome != 'success'
        run: exit 1
