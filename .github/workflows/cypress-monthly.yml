name: Cypress monthly real-service checks

on:
  schedule:
    # 03:23 UTC on the 1st of each month. No push or pull request.
    - cron: "23 3 1 * *"
  workflow_dispatch:
    inputs:
      run_monthly:
        description: Type run-monthly-once to start one production suite
        required: true
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: 23-store-monthly-real-service-tests
  cancel-in-progress: false

jobs:
  production-monthly:
    if: github.run_attempt == 1 && (github.event_name == 'schedule' || github.event.inputs.run_monthly == 'run-monthly-once')
    name: Production inventory, preflight, and browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      CYPRESS_INSTALL_BINARY: "0"
      NEXT_PUBLIC_PRODUCTION_URL: ${{ vars.NEXT_PUBLIC_PRODUCTION_URL || secrets.NEXT_PUBLIC_PRODUCTION_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_STRIPE_SECRET_KEY: ${{ secrets.NEXT_STRIPE_SECRET_KEY }}
      E2E_RUN_ID: gha-${{ github.run_id }}
      E2E_ARTIFACT_DIR: artifacts/e2e

    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inventory, preflight, and run the production suite
        id: monthly
        continue-on-error: true
        run: pnpm e2e:weekly

      - name: Upload monthly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-monthly-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/e2e
            cypress/screenshots
            cypress/videos
            cypress/results

      - name: Fail the job when checks or reporting failed
        if: always() && steps.monthly.outcome != 'success'
        run: exit 1
